# Versiones y hashes de lo que instalar.ps1 y habilitar-sensores.ps1 descargan. Los scripts no bajan nada que no esté acá: verifica el SHA-256 antes de
# extraer o ejecutar y se detiene si no coincide. Solo se aceptan direcciones https://github.com/.
# Para actualizar una versión: cambiar version, url y sha256 a la vez, verificando el hash contra la página oficial del proyecto.

[pc_doctor]
# Versión de este paquete (la misma que pyproject.toml y version.txt; empaquetar.py falla si no coinciden). instalar.ps1 la compara con la instalada.
version = "1.1.0"

[uv]
# Lo instala instalar.ps1 si falta uv. Zip oficial de Astral para Windows de 64 bits; el SHA-256 coincide con el .sha256 que publica GitHub
# y con el que calculamos al descargarlo (verificado el 2026-10-29).
version = "0.13.6"
url = "https://github.com/astral-sh/uv/releases/download/0.13.6/uv-x86_64-pc-windows-msvc.zip"
sha256 = "a2a8820d5eea32f08ef467ef3b7f66883a9b076d5737a2fc2fbb5f458d1bb50f"

[python]
# Lo descarga uv (python-build-standalone, con su propia verificación de integridad): acá solo se fija la versión.
version = "3.12"

[librehardwaremonitor]
# Build para .NET Framework (viene con Windows 10/11, no instala nada más). Verificado el 2026-10-29: el SHA-256 coincide con el que publica GitHub.
version = "0.9.6"
url = "https://github.com/LibreHardwareMonitor/LibreHardwareMonitor/releases/download/v0.9.6/LibreHardwareMonitor.zip"
sha256 = "086d9f1b5a99e643edc2cfaaac16051685b551e4c5ac0b32a57c58c0e529c001"

[smartmontools]
# Opcional (-ConSmartctl). Instalador oficial con firma Authenticode. El MD5 coincide con el que publica el proyecto (bb1e199ad6a3db3e1c27ae54b835cbd5);
# el SHA-256 lo calculamos acá el 2026-10-29 porque GitHub no lo publica. La firma GPG (.asc) no se verificó.
version = "7.5"
url = "https://github.com/smartmontools/smartmontools/releases/download/RELEASE_7_5/smartmontools-7.5.win32-setup.exe"
sha256 = "896337fcc253220614cf8cdbd5cf2321c5aa326a37a04160a672a281e6104c70"

[pawnio]
# Opcional (-InstalarPawnIO): driver que LibreHardwareMonitor usa para leer la CPU y la placa. Instalador firmado; el SHA-256 coincide con el que publica GitHub
# (verificado el 2026-10-29). Es la versión de los módulos que trae LibreHardwareMonitor 0.9.6.
version = "2.2.0"
url = "https://github.com/namazso/PawnIO.Setup/releases/download/2.2.0/PawnIO_setup.exe"
sha256 = "1f519a22e47187f70a1379a48ca604981c4fcf694f4e65b734aaa74a9fba3032"
